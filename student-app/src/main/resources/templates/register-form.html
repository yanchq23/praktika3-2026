<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Регистрация</title><link rel="stylesheet" href="/style.css"></head>
<body><main class="card"><h1>Регистрация</h1><p class="muted">Создайте аккаунт</p>
<p class="error" th:if="${error}" th:text="${error}"></p>
<form action="/register" method="post"><label>Логин<input name="username" required></label><label>Пароль<input type="password" name="password" required></label><button type="submit">Создать аккаунт</button></form>
<p>Уже зарегистрированы? <a href="/login">Войти</a></p></main></body></html>
