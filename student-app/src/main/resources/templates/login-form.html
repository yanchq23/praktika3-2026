<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Вход</title><link rel="stylesheet" href="/style.css"></head>
<body><main class="card"><h1>Вход</h1><p class="muted">Войдите, чтобы открыть список студентов</p>
<p class="error" th:if="${error}" th:text="${error}"></p>
<form action="/login" method="post"><label>Логин<input name="username" required></label><label>Пароль<input type="password" name="password" required></label><button type="submit">Войти</button></form>
<p>Нет аккаунта? <a href="/register">Зарегистрироваться</a></p></main></body></html>
