<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Добавить студента</title><link rel="stylesheet" href="/style.css"></head>
<body><main class="card"><h1>Новый студент</h1><form action="/students/add" method="post" th:object="${student}">
<label>Имя и фамилия<input th:field="*{name}" required></label><label>Курс<input type="number" th:field="*{course}" min="1" max="6" required></label>
<label class="check"><input type="checkbox" th:field="*{hasDebt}"> Есть задолженность</label><button type="submit">Сохранить</button></form><p><a href="/students">← Вернуться к списку</a></p></main></body></html>
